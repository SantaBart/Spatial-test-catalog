name: Keep Supabase Awake

on:
  schedule:
    - cron: "17 9 * * *"   # every day at 09:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase table
        run: |
          URL="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/rest/v1/tests?select=id&limit=1"

          echo "Pinging Supabase table..."

          STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "$URL")

          echo "HTTP status: $STATUS"
          echo "Response:"
          cat response.txt

          if [ "$STATUS" != "200" ]; then
            echo "Supabase table query failed"
            exit 1
          fi
